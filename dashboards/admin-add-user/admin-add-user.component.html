<div class="container">
  <div class="card">
    <h2>Add New User</h2>

    <form (ngSubmit)="addUser()">

      <div class="form-group">
        <label>Name</label>
        <input
          type="text"
          name="name"
          [(ngModel)]="user.name"

          required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="user.email"
          required>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input
          type="text"
          [(ngModel)]="user.phone"
          name="phone"
          required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="user.password"
          name="password"
          required>
      </div>

      <button type="submit">
        Add User
      </button>

    </form>
  </div>
</div>
